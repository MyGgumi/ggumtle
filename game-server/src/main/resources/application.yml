spring:
  application:
    name: ggumtle

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    hibernate:
      ddl-auto: update

game-server:
    port: 8888
    max-players-per-room: 6
    tick-rate: 30
    id: 1

jwt:
  access:
    secret: ${ACCESS_SECRET}

logging:
  level:
    com.ggumtle: DEBUG